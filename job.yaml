            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/gabriella@land.ufrj.br/02_silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/gabriella@land.ufrj.br/03_gold
            source: WORKSPACE
